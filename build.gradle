/*
 * Fate Locked Ironman — RuneLite external plugin.
 *
 * Standard RuneLite Plugin Hub build template. The Hub builds this in a sandbox
 * with dependency verification on and provides the RuneLite runtime (client,
 * Gson, Guice, SLF4J) itself, so the plugin must NOT shade/fat-jar its deps.
 *
 * Build a sideload jar:  ./gradlew jar  → build/libs/*.jar
 * Sideload:              copy it into ~/.runelite/sideloaded-plugins/
 */

plugins {
    id 'java'
}

group 'com.fatelocked'
// Overridable from CI for tagged releases: gradle jar -PpluginVersion=0.2.0
version = project.findProperty('pluginVersion') ?: '0.1.0'
sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

repositories {
    mavenCentral()
    maven { url = 'https://repo.runelite.net' }
}

def runeLiteVersion = 'latest.release'

dependencies {
    // RuneLite's client brings Guice / Gson / SLF4J transitively (and its repo
    // hosts the guice `no_aop` variant). These are provided by the RuneLite
    // runtime at load time, so everything is compileOnly — no shading.
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('verifyPluginHubJar') {
    dependsOn tasks.named('jar')
    doLast {
        File pluginJar = tasks.named('jar').get()
            .archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(pluginJar)
        try {
            def entries = zip.entries().toList()
            def names = entries.collect { it.name }
            [
                'net/runelite/', 'okhttp3/', 'com/google/gson/',
                'com/google/inject/', 'org/slf4j/'
            ].each { prefix ->
                if (names.any { it.startsWith(prefix) }) {
                    throw new GradleException(
                        "shaded dependency found: ${prefix}")
                }
            }
            String classText = entries
                .findAll {
                    !it.directory && it.name.endsWith('.class')
                }
                .collect {
                    new String(
                        zip.getInputStream(it).bytes,
                        java.nio.charset.StandardCharsets.ISO_8859_1)
                }.join('\n')
            // Route literals are inspected in the sole request-owning class.
            // Scanning every class would confuse Java package references such
            // as net/runelite/api/events with an HTTP "/events" route.
            String routeText = entries
                .findAll {
                    !it.directory
                        && it.name.startsWith(
                            'com/fatelocked/TrackerConnectionController')
                        && it.name.endsWith('.class')
                }
                .collect {
                    new String(
                        zip.getInputStream(it).bytes,
                        java.nio.charset.StandardCharsets.ISO_8859_1)
                }.join('\n')
            [
                '/events', '/acks', '/suggest', '/state'
            ].each { forbidden ->
                if (routeText.contains(forbidden)) {
                    throw new GradleException(
                        "forbidden jar route: ${forbidden}")
                }
            }
            [
                'FateEventRelayClient', 'FateEventOutbox',
                'RequestBody', 'localhost', '127.0.0.1'
            ].each { forbidden ->
                if (classText.contains(forbidden)) {
                    throw new GradleException(
                        "forbidden jar symbol: ${forbidden}")
                }
            }
        } finally {
            zip.close()
        }
    }
}

check.dependsOn tasks.named('verifyPluginHubJar')
