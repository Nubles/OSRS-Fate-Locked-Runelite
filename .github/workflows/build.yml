name: Build

# `build` runs this repository's own Gradle build: tests, the source and jar
# compliance gates, and the standard jar. The Plugin Hub replaces build.gradle
# with its own standard build and pins RuneLite to its runelite.version, so
# `hub-standard-build` also packages each commit with the Hub's own packager
# and checks the jar that produces.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the web contract copy against its pinned commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/pin-web-contracts.sh --check
      - name: Set up JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.5'
      - name: Test and verify Hub-compatible jar
        run: gradle clean check --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fatelocked-plugin
          path: build/libs/*.jar
          if-no-files-found: error

  hub-standard-build:
    runs-on: ubuntu-24.04
    env:
      # The packager the Plugin Hub uses today: the PACKAGER_URL line in
      # runelite/plugin-hub's .github/workflows/build.yml (v6 since 18 Nov 2026).
      PACKAGER_URL: https://github.com/runelite/plugin-hub-tooling/releases/download/v6/bundle.tar.zst
      # sha256 of that v6 bundle, computed from a fresh download on 24 Nov 2026
      # (two separate downloads gave the same value). The Hub's "fetch packager"
      # step runs sha256sum on the bundle, so its log shows the value to compare.
      PACKAGER_SHA256: 8ca79aa71611b85ea42ecd81d01e483027d84c158fc34d554521c4407fe76acd
      REPO: ${{ github.event.pull_request.head.repo.clone_url || format('https://github.com/{0}.git', github.repository) }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Build only: the packager skips its upload setup, which needs the
      # Hub's credentials, when this is set.
      PACKAGE_IS_PR: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Cache the Plugin Hub packager
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: hub/bundle.tar.zst
          key: hub-packager-${{ env.PACKAGER_SHA256 }}
      - name: Package this commit with the Plugin Hub's packager
        run: |
          set -eu
          mkdir -p hub /tmp/jars
          cd hub
          [ -f bundle.tar.zst ] || curl --location --fail --retry 4 --max-time 120 --output bundle.tar.zst "$PACKAGER_URL"
          echo "$PACKAGER_SHA256  bundle.tar.zst" | sha256sum -c -
          tar xf bundle.tar.zst
          git clone --quiet --depth 1 https://github.com/runelite/plugin-hub.git plugin-hub
          # Fail when the Hub has moved to another packager, because a green
          # job would then no longer show that the real Hub build passes.
          if ! grep -qF "$PACKAGER_URL" plugin-hub/.github/workflows/build.yml; then
            echo "::error::The Plugin Hub now uses a different packager. In .github/workflows/build.yml (hub-standard-build) set PACKAGER_URL to the PACKAGER_URL in runelite/plugin-hub's .github/workflows/build.yml, and PACKAGER_SHA256 to the sha256 that the Hub's 'fetch packager' step prints (or run sha256sum on that bundle)."
            exit 1
          fi
          printf 'repository=%s\ncommit=%s\n' "$REPO" "$SHA" > plugin-hub/plugins/fate-locked-ironman
          # The packager reads the entry file's git history.
          git -C plugin-hub -c user.name=ci -c user.email=ci@invalid commit --quiet -am "build $SHA"
          ./prepare.sh
          # Name the plugin, as the Hub's manual builds do: the packager only
          # accepts an entry file that sits directly in its own plugins folder.
          FORCE_BUILD=fate-locked-ironman java -cp package.jar net.runelite.pluginhub.packager.Packager
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.5'
      - name: Verify the jar the Plugin Hub built
        run: |
          JAR=$(find /tmp/jars -name '*.jar' | head -n 1)
          test -n "$JAR" || { echo "The packager produced no jar"; exit 1; }
          gradle verifyPluginHubJar -PpluginHubJar="$JAR" --no-daemon
